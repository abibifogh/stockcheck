name: Breakfast database

# Run a database update against the breakfast database from a button, rather
# than by pasting SQL into the D1 console.
#
# Actions → Breakfast database → Run workflow → pick the update → type
# "breakfast" → Run.
#
# Nothing here runs on its own. A schema change is a decision, and one that
# fired on every merge could land before the code that needs it, or replay an
# update that already ran.
#
# Each update is checked first: if its change is already in the database, the
# run says so and stops, instead of failing half-way on "duplicate column".
# The files are the same ones anybody would otherwise paste by hand from
# migrations/console/, so this adds a way to run them and nothing new.

on:
  workflow_dispatch:
    inputs:
      update:
        description: Which update to run
        required: true
        default: 0024_storeroom.sql
        type: choice
        options:
          # The storeroom: requests, issues, item kinds, where deliveries go.
          - 0024_storeroom.sql
          # Only reads: which updates the database already has.
          - check-only
      confirm:
        description: Type "breakfast" to confirm
        required: true
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # Typing the database name is the safety catch. This writes to the live
      # database, and a stray click in the Actions tab should not be enough.
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "breakfast" ]; then
            echo "::error::Type 'breakfast' in the confirm box to run this."
            exit 1
          fi

      - name: Check for Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::No Cloudflare credentials in this repository." \
              "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under" \
              "Settings → Secrets and variables → Actions. The token needs D1 edit permission."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # What the database has now. Each update leaves a mark that is cheap to
      # look for; this reads them all, so the summary says what is there.
      - name: What the database has
        id: state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute breakfast --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM pragma_table_info('purchases') WHERE name = 'odoo_line_id') AS has_0022,
              (SELECT COUNT(*) FROM pragma_table_info('ingredients') WHERE name = 'kind') AS has_0024
          " > state.json
          has_0024=$(node -e "const r=require('./state.json');console.log(r[0].results[0].has_0024)")
          has_0022=$(node -e "const r=require('./state.json');console.log(r[0].results[0].has_0022)")
          echo "has_0024=$has_0024" >> "$GITHUB_OUTPUT"
          {
            echo "### Breakfast database before this run"
            echo ""
            echo "| Update | Applied |"
            echo "| --- | --- |"
            echo "| 0022 Odoo purchases | $([ "$has_0022" = "1" ] && echo yes || echo no) |"
            echo "| 0024 Storeroom | $([ "$has_0024" = "1" ] && echo yes || echo no) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run 0024_storeroom.sql
        if: inputs.update == '0024_storeroom.sql'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ steps.state.outputs.has_0024 }}" = "1" ]; then
            echo "The storeroom update is already in the database. Nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx wrangler d1 execute breakfast --remote --file=./migrations/console/0024_storeroom.sql
          npx wrangler d1 execute breakfast --remote --json --command \
            "SELECT key, value FROM settings WHERE key IN ('deliveries_to', 'store_departments')" > after.json
          {
            echo ""
            echo "### Storeroom update applied"
            echo ""
            node -e "for (const r of require('./after.json')[0].results) console.log('- ' + r.key + ': ' + String(r.value).replace(/\n/g, ', '))"
          } >> "$GITHUB_STEP_SUMMARY"
