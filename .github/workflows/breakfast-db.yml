name: Breakfast database

# Run a database update against the breakfast database from a button, rather
# than by pasting SQL into the D1 console.
#
# Actions → Breakfast database → Run workflow → pick the update → type
# "breakfast" → Run.
#
# Nothing here runs on its own. A schema change is a decision, and one that
# fired on every merge could land before the code that needs it, or replay an
# update that already ran.
#
# Each update is checked first: if its change is already in the database, the
# run says so and stops, instead of failing half-way on "duplicate column".
# The files are the same ones anybody would otherwise paste by hand from
# migrations/console/, so this adds a way to run them and nothing new.

on:
  workflow_dispatch:
    inputs:
      update:
        description: Which update to run
        required: true
        default: 0025_odoo_expected.sql
        type: choice
        options:
          # Stock from Odoo: the lines Insight sends that are on their way.
          - 0025_odoo_expected.sql
          # The storeroom: requests, issues, item kinds, where deliveries go.
          - 0024_storeroom.sql
          # The bell and phone alerts: whichever of 0004, 0009 and 0013 the
          # database is missing. Each adds tables or a column; none touches data.
          - notifications
          # Only reads: which updates the database already has.
          - check-only
      confirm:
        description: Type "breakfast" to confirm
        required: true
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # Typing the database name is the safety catch. This writes to the live
      # database, and a stray click in the Actions tab should not be enough.
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "breakfast" ]; then
            echo "::error::Type 'breakfast' in the confirm box to run this."
            exit 1
          fi

      - name: Check for Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::No Cloudflare credentials in this repository." \
              "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under" \
              "Settings → Secrets and variables → Actions. The token needs D1 edit permission."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # What the database has now. Each update leaves a mark that is cheap to
      # look for; this reads them all, so the summary says what is there.
      - name: What the database has
        id: state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute breakfast --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'push_subscriptions') AS has_0004,
              (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'app_notices') AS has_0009,
              (SELECT COUNT(*) FROM pragma_table_info('app_notices') WHERE name = 'audience') AS has_0013,
              (SELECT COUNT(*) FROM pragma_table_info('purchases') WHERE name = 'odoo_line_id') AS has_0022,
              (SELECT COUNT(*) FROM pragma_table_info('ingredients') WHERE name = 'kind') AS has_0024,
              (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'odoo_expected') AS has_0025
          " > state.json
          has() { node -e "const r=require('./state.json');console.log(r[0].results[0].has_$1)"; }
          has_0004=$(has 0004); has_0009=$(has 0009); has_0013=$(has 0013)
          has_0022=$(has 0022); has_0024=$(has 0024); has_0025=$(has 0025)
          for n in 0004 0009 0013 0022 0024 0025; do echo "has_$n=$(has $n)" >> "$GITHUB_OUTPUT"; done
          yn() { [ "$1" = "1" ] && echo yes || echo no; }
          {
            echo "### Breakfast database before this run"
            echo ""
            echo "| Update | Applied |"
            echo "| --- | --- |"
            echo "| 0004 Phone alerts | $(yn "$has_0004") |"
            echo "| 0009 The bell | $(yn "$has_0009") |"
            echo "| 0013 Who each notice is for | $(yn "$has_0013") |"
            echo "| 0022 Odoo purchases | $(yn "$has_0022") |"
            echo "| 0024 Storeroom | $(yn "$has_0024") |"
            echo "| 0025 Stock from Odoo, on its way | $(yn "$has_0025") |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run 0024_storeroom.sql
        if: inputs.update == '0024_storeroom.sql'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ steps.state.outputs.has_0024 }}" = "1" ]; then
            echo "The storeroom update is already in the database. Nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx wrangler d1 execute breakfast --remote --file=./migrations/console/0024_storeroom.sql
          npx wrangler d1 execute breakfast --remote --json --command \
            "SELECT key, value FROM settings WHERE key IN ('deliveries_to', 'store_departments')" > after.json
          {
            echo ""
            echo "### Storeroom update applied"
            echo ""
            node -e "for (const r of require('./after.json')[0].results) console.log('- ' + r.key + ': ' + String(r.value).replace(/\n/g, ', '))"
          } >> "$GITHUB_STEP_SUMMARY"

      # Only creates a table, so it is safe on any database that has 0022 and
      # 0024; it needs them (purchases.odoo_line_id, ingredients.kind).
      - name: Run 0025_odoo_expected.sql
        if: inputs.update == '0025_odoo_expected.sql'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ steps.state.outputs.has_0025 }}" = "1" ]; then
            echo "The stock-from-Odoo update is already in the database. Nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ steps.state.outputs.has_0022 }}" != "1" ] || [ "${{ steps.state.outputs.has_0024 }}" != "1" ]; then
            echo "::error::Run 0022 (Odoo purchases) and 0024 (storeroom) first; this update builds on both."
            exit 1
          fi
          npx wrangler d1 execute breakfast --remote --file=./migrations/console/0025_odoo_expected.sql
          echo "### Stock from Odoo update applied: odoo_expected created" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the notification updates
        if: inputs.update == 'notifications'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ran=""
          if [ "${{ steps.state.outputs.has_0004 }}" != "1" ]; then
            npx wrangler d1 execute breakfast --remote --file=./migrations/console/0004_push_alerts.sql
            ran="$ran 0004"
          fi
          if [ "${{ steps.state.outputs.has_0009 }}" != "1" ]; then
            npx wrangler d1 execute breakfast --remote --file=./migrations/console/0009_notices.sql
            ran="$ran 0009"
          fi
          # 0013 adds a column, so it can only run once: skipped when it is there.
          if [ "${{ steps.state.outputs.has_0013 }}" != "1" ]; then
            npx wrangler d1 execute breakfast --remote --file=./migrations/console/0013_notice_audience.sql
            ran="$ran 0013"
          fi
          {
            echo ""
            if [ -z "$ran" ]; then
              echo "The notification updates are all in the database already. Nothing to do."
            else
              echo "### Notification updates applied:$ran"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
