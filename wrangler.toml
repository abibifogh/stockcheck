name = "niceoperation-breakfast"
main = "src/index.js"
compatibility_date = "2025-05-01"

# Static frontend is served straight from the Worker's asset store.
# `run_worker_first` keeps /api/* on the Worker instead of falling through to
# the SPA index.html.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "breakfast"
# Replace with the id printed by `npm run db:create`.
database_id = "9862ed78-69f0-4dfe-a36f-7fe3bd9020c1"

[vars]
# Everything here is safe to keep in source control. Secrets (PINs, session
# key) are set with `wrangler secret put` — see README.
APP_NAME = "Nice Operation"

# Custom domain. Comment this block out until the zone is active on Cloudflare,
# otherwise the first deploy fails on an unknown route.
[[routes]]
pattern = "breakfast.niceoperation.com"
custom_domain = true

# Once a day, early enough that a due stock count is announced before the shift
# starts. 06:00 UTC is 06:00 in Accra — cron expressions are always UTC.
[triggers]
# Hourly. The stock-count opener only needs a day, but a tool that has not come
# back is checked against a 24-hour clock, and a daily sweep would chase it up
# to a day and a half late. Both jobs are idempotent, so the extra runs are
# near-empty queries.
crons = ["0 * * * *"]

[observability]
enabled = true
