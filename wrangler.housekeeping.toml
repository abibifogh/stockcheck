# The housekeeping site: housekeeping.niceoperation.com
#
# A second Worker, deployed from the same code as the breakfast site but
# entirely its own deployment. Nothing here touches `wrangler.toml`, and
# deploying this one cannot restart, replace or break the breakfast Worker —
# which is the whole point of keeping them apart.
#
#   npm run deploy:housekeeping
#
# What is shared and what is not:
#
#   Shared      the D1 database. One set of people, PINs, permissions and
#               settings across both sites, so a housekeeper is added once and
#               a manager does not carry two passwords. The bed check's own
#               tables (hk_*) are additive — the breakfast Worker neither reads
#               nor notices them.
#
#   Not shared  secrets. Every Worker holds its own, so this one needs its own
#               SESSION_SECRET (and RESEND_API_KEY, if the bed check is to send
#               email). See the README.
#
# If you ever want the two properly independent — separate people, separate
# everything — point `database_id` at a second D1 database and run the
# migrations against that instead.

name = "niceoperation-housekeeping"
main = "src/index.js"
compatibility_date = "2025-05-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "breakfast"
# The same database the breakfast site uses. Migrations are applied once,
# against this database, by either site's deploy — they are the same tables.
database_id = "9862ed78-69f0-4dfe-a36f-7fe3bd9020c1"

[vars]
APP_NAME = "Nice Operation · Housekeeping"

# Comment this block out for the very first deploy if the hostname does not
# exist yet and Cloudflare refuses the route; you will get a *.workers.dev
# address to test on, and can put it back once the zone is ready.
[[routes]]
pattern = "housekeeping.niceoperation.com"
custom_domain = true

[observability]
enabled = true
