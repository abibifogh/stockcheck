<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#edf0f3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)" />
  <link rel="preload" href="/vendor/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
  <title>Breakfast Control</title>
  <meta name="description" content="The kitchen and the bakery, recorded in a few taps and analysed." />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- Installed on an iPhone: its own icon and name on the home screen, and
       full screen without Safari's bars. -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Breakfast" />
  <script>
    // Two Workers serve these same files: the main site, and the housekeeping
    // site at housekeeping.niceoperation.com. The tab title, the
    // favicon and — the one that matters — the identity a phone records when
    // somebody adds the page to their home screen are all settled before any
    // module loads, so the decision is made here, inline, by the same rule
    // public/js/brand.js uses.
    if (/housekeeping/.test(location.hostname)) {
      document.documentElement.dataset.app = 'housekeeping';
      document.title = 'Bed Check · Breakfast Control';
      document.querySelector('link[rel="manifest"]').href = '/manifest.housekeeping.webmanifest';
      document.querySelector('link[rel="icon"]').href = '/icons/hk-icon-192.png';
      document.querySelector('link[rel="apple-touch-icon"]').href = '/icons/hk-apple-touch-icon.png';
      document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'Bed Check';
    }
  </script>
</head>
<body>
  <div id="app" class="app-loading">
    <div class="boot">
      <!-- Set in CSS, so the housekeeping site does not flash a frying pan
           while it loads. -->
      <div class="boot-mark" aria-hidden="true"></div>
      <p>Loading…</p>
    </div>
  </div>
  <div id="toasts" class="toasts" popover="manual" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
