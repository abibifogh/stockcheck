<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>Nice Operation</title>
  <meta name="description" content="The kitchen, the parts store and the bakery, recorded in a few taps and analysed." />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script>
    // Two Workers serve these same files: the main site, and the housekeeping
    // site at housekeeping.niceoperation.com. The tab title, the
    // favicon and — the one that matters — the identity a phone records when
    // somebody adds the page to their home screen are all settled before any
    // module loads, so the decision is made here, inline, by the same rule
    // public/js/brand.js uses.
    if (/housekeeping/.test(location.hostname)) {
      document.documentElement.dataset.app = 'housekeeping';
      document.title = 'Bed Check · Nice Operation';
      document.querySelector('link[rel="manifest"]').href = '/manifest.housekeeping.webmanifest';
      document.querySelector('link[rel="icon"]').href =
        "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛏</text></svg>";
    }
  </script>
</head>
<body>
  <div id="app" class="app-loading">
    <div class="boot">
      <!-- Set in CSS, so the housekeeping site does not flash a frying pan
           while it loads. -->
      <div class="boot-mark" aria-hidden="true"></div>
      <p>Loading…</p>
    </div>
  </div>
  <div id="toasts" class="toasts" popover="manual" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
