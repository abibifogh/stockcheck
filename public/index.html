<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>Breakfast Control · Nice Operation</title>
  <meta name="description" content="Daily breakfast ingredient usage tracking and consumption analytics." />
  <link rel="stylesheet" href="/styles.css" />
  <!-- Real files, not data: URIs. A phone adding this page to its home screen
       does not use the favicon: Android reads the manifest and will not fetch
       a data: URI for an icon, and iOS ignores the manifest and looks for
       apple-touch-icon, which has to be a PNG. -->
  <link rel="icon" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Breakfast" />
  <script>
    // Two Workers serve these same files: the breakfast site, and the
    // housekeeping site at housekeeping.niceoperation.com. The tab title, the
    // favicon and — the one that matters — the identity a phone records when
    // somebody adds the page to their home screen are all settled before any
    // module loads, so the decision is made here, inline, by the same rule
    // public/js/brand.js uses.
    //
    // The housekeeping Worker also swaps these files server-side, at the same
    // paths, so a browser that read the tags before this ran still gets a bed.
    if (/housekeeping/.test(location.hostname)) {
      document.documentElement.dataset.app = 'housekeeping';
      document.title = 'Bed Check · Nice Operation';
      const set = (selector, value, attr) =>
        document.querySelector(selector)?.setAttribute(attr || 'href', value);
      set('link[rel="manifest"]', '/manifest.housekeeping.webmanifest');
      set('link[rel="icon"]', '/icon.housekeeping.svg');
      set('link[rel="apple-touch-icon"]', '/apple-touch-icon.housekeeping.png');
      set('meta[name="apple-mobile-web-app-title"]', 'Bed Check', 'content');
    }
  </script>
</head>
<body>
  <div id="app" class="app-loading">
    <div class="boot">
      <!-- Set in CSS, so the housekeeping site does not flash a frying pan
           while it loads. -->
      <div class="boot-mark" aria-hidden="true"></div>
      <p>Loading…</p>
    </div>
  </div>
  <div id="toasts" class="toasts" popover="manual" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
